openapi: 3.1.0
info:
  title: ConnectSphere API
  version: 0.1.0
  description: HTTP endpoints owned by the ConnectSphere Next.js application.
servers:
  - url: http://localhost:3000
paths:
  /api/health:
    get:
      summary: Check whether the web application is running
      operationId: getHealth
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                required: [status, service, timestamp]
                properties:
                  status:
                    type: string
                    const: ok
                  service:
                    type: string
                    const: connectsphere
                  timestamp:
                    type: string
                    format: date-time
